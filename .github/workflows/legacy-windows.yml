name: Legacy Windows build
on:
  push:
    branches: [legacy-low-spec]
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "legacy/**"
      - ".github/workflows/legacy-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 Legacy package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-windows-x64

      - name: Build Horizon client
        run: cargo build --locked --release -p horizon-client --bin horizon-client

      - name: Assemble portable Legacy package
        shell: pwsh
        run: |
          $package = "target/legacy-package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $exe = "target/release/horizon-client.exe"
          if (!(Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          Copy-Item $exe "$package/horizon-client.exe"
          Copy-Item "legacy/Start-Legacy-OpenGL.bat" $package
          Copy-Item "legacy/README.md" $package
          Get-ChildItem $package | Format-Table Name,Length

      - name: Upload Windows Legacy package
        uses: actions/upload-artifact@v4
        with:
          name: horizon-legacy-windows-x64
          path: target/legacy-package/*
          if-no-files-found: error
          retention-days: 7
