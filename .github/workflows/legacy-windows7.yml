name: Legacy Windows 7 x64 build

on:
  push:
    branches: [legacy-windows7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-windows7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows7-x64:
    name: Build Windows 7 x64 compatibility test
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Microsoft C++ build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install nightly Rust and Rust sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-windows7-x64-win7-target

      - name: Create Windows 7 target specification
        shell: pwsh
        run: |
          rustc -Z unstable-options --print target-spec-json --target x86_64-pc-windows-msvc |
            Out-File -Encoding utf8 target-win7.json
          $spec = Get-Content target-win7.json -Raw
          if ($spec -notmatch '"vendor"\s*:\s*"pc"') {
            throw "Unexpected MSVC target specification; vendor field was not pc."
          }
          $spec = $spec -replace '"vendor"\s*:\s*"pc"', '"vendor": "win7"'
          Set-Content -Encoding utf8 target-win7.json $spec
          Get-Content target-win7.json

      # glutin_wgl_sys 0.6.1 checks the TARGET triple text for the word
      # "windows". Cargo names JSON targets after the JSON filename ("target-win7"),
      # so that check skips generating WGL bindings. Use Cargo's target OS cfg instead.
      - name: Patch WGL bindings generation for custom target
        shell: pwsh
        run: |
          cargo fetch --locked
          $crate = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src" -Directory -Recurse -Filter "glutin_wgl_sys-0.6.1" |
            Select-Object -First 1
          if (!$crate) {
            throw "glutin_wgl_sys 0.6.1 source was not downloaded."
          }
          $build = Join-Path $crate.FullName "build.rs"
          $source = Get-Content $build -Raw
          $old = 'let target = env::var("TARGET").unwrap();'
          if (!$source.Contains($old)) {
            throw "Unexpected glutin_wgl_sys build.rs: TARGET declaration not found."
          }
          $source = $source.Replace($old, '')
          $oldCondition = 'if target.contains("windows") {'
          if (!$source.Contains($oldCondition)) {
            throw "Unexpected glutin_wgl_sys build.rs: Windows condition not found."
          }
          $source = $source.Replace($oldCondition, 'if env::var("CARGO_CFG_TARGET_OS").as_deref() == Ok("windows") {')
          Set-Content -Path $build -Value $source -NoNewline
          Write-Host "Patched WGL generation to use CARGO_CFG_TARGET_OS."

      - name: Build Horizon client for Windows 7
        run: cargo build --locked --no-default-features -Z json-target-spec -Z build-std=std,panic_unwind --target target-win7.json --release -p horizon-client --bin horizon-client

      - name: Assemble experimental package
        shell: pwsh
        run: |
          $package = "target/legacy-windows7-package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $exe = "target/target-win7/release/horizon-client.exe"
          if (!(Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          Copy-Item $exe "$package/horizon-client.exe"
          Copy-Item "legacy-windows7/Start-Windows7-OpenGL.bat" $package
          Copy-Item "legacy-windows7/README.md" $package
          Get-ChildItem $package | Format-Table Name,Length

      - name: Upload experimental Windows 7 package
        uses: actions/upload-artifact@v4
        with:
          name: horizon-legacy-windows7-x64
          path: target/legacy-windows7-package/*
          if-no-files-found: error
          retention-days: 7
