name: Legacy Windows 7 x64 build

on:
  push:
    branches: [legacy-windows7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-windows7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows7-x64:
    name: Build Windows 7 x64 compatibility test
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install nightly Rust and Rust sources
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-windows7-x64-win7-target

      # Build a custom Win7 target using the MSVC ABI and Win7 std fallbacks.
      - name: Create Windows 7 target specification
        shell: pwsh
        run: |
          rustc -Z unstable-options --print target-spec-json --target x86_64-pc-windows-msvc |
            Out-File -Encoding utf8 target-win7.json
          $spec = Get-Content target-win7.json -Raw
          if ($spec -notmatch '"vendor"\s*:\s*"pc"') {
            throw "Unexpected MSVC target specification; vendor field was not pc."
          }
          $spec = $spec -replace '"vendor"\s*:\s*"pc"', '"vendor": "win7"'
          Set-Content -Encoding utf8 target-win7.json $spec
          Get-Content target-win7.json

      - name: Build Horizon client for Windows 7
        run: cargo build --locked -Z json-target-spec -Z build-std=std,panic_unwind --target target-win7.json --release -p horizon-client --bin horizon-client

      - name: Assemble experimental package
        shell: pwsh
        run: |
          $package = "target/legacy-windows7-package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $exe = "target/target-win7/release/horizon-client.exe"
          if (!(Test-Path $exe)) {
            throw "Build did not produce $exe"
          }
          Copy-Item $exe "$package/horizon-client.exe"
          Copy-Item "legacy-windows7/Start-Windows7-OpenGL.bat" $package
          Copy-Item "legacy-windows7/README.md" $package
          Get-ChildItem $package | Format-Table Name,Length

      - name: Upload experimental Windows 7 package
        uses: actions/upload-artifact@v4
        with:
          name: horizon-legacy-windows7-x64
          path: target/legacy-windows7-package/*
          if-no-files-found: error
          retention-days: 7
